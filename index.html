<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<title>Pocket Plaza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ef;--ink:#3b2f3f;--mut:#8a7f92;--pink:#ff8fb1;--pinkD:#e8668f;--mint:#4fcf9d;--mintD:#33a87a;--sky:#7ab8ff;--lav:#a78bfa;--card:#fff;--line:#f1e4d8;--gold:#ffc94a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:'Fredoka','Nunito',sans-serif;margin:0}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#hud{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border-bottom:2px solid var(--line);z-index:6}
#meBtn{display:flex;align-items:center;gap:6px;border:0;background:#fff0f5;border-radius:999px;padding:2px 10px 2px 2px;font-weight:800;font-size:14px;max-width:40%}
#meBtn canvas{width:34px;height:34px;border-radius:50%;background:#ffe3ec}
#meNick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
#locName{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#online{font-size:11px;font-weight:800;color:var(--mintD)}
#online.solo{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff6dc;border:2px solid #ffe7a6;border-radius:999px;padding:3px 10px;font-weight:800;font-size:14px}
.iconbtn{border:0;background:#f4eefc;border-radius:50%;width:34px;height:34px;font-size:16px}
#stage{position:relative;flex:1;overflow:hidden;min-height:0}
#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#nav{display:flex;background:#fff;border-top:2px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom));z-index:6}
#nav button{flex:1;border:0;background:none;font-size:11px;font-weight:800;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:14px}
#nav button .i{font-size:22px;line-height:1.1}
#nav button.on{color:var(--pinkD);background:#fff0f5}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pinkD);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pinkD)}
.btn.mint{background:var(--mint);box-shadow:0 3px 0 var(--mintD)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;pointer-events:none}
.topbar>*{pointer-events:auto}
.chip{border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,50,90,.12)}
.chip.label{background:rgba(59,47,63,.78);color:#fff;border-color:transparent}
#chatBar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;z-index:3}
#chatBar input{flex:1;min-width:0;border:2px solid #fff;border-radius:999px;padding:10px 14px;font:inherit;font-size:15px;font-weight:700;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(80,50,90,.15);outline:none}
#chatBar input:focus{border-color:var(--pink)}
#chatBar .iconbtn{width:42px;height:42px;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(80,50,90,.15);font-size:19px;flex:none}
#chatBar .btn{flex:none}
#emoteTray{position:absolute;left:8px;bottom:60px;background:#fff;border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(4,46px);gap:6px;box-shadow:0 6px 20px rgba(80,50,90,.2);z-index:4}
#emoteTray button{border:0;background:#fff5f8;border-radius:14px;height:46px;font-size:22px}
#chatLog{position:absolute;left:8px;bottom:60px;width:min(330px,calc(100% - 16px));max-height:42%;overflow-y:auto;background:rgba(255,255,255,.95);border-radius:18px;padding:10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(80,50,90,.2);z-index:4;user-select:text;-webkit-user-select:text}
#chatLog .ln{margin:3px 0;word-wrap:break-word}
#chatLog .ln b{color:var(--pinkD)}
#chatLog .ln.sys{color:var(--mut);font-style:italic}
#editTray{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(80,50,90,.16);padding:10px 12px 12px;z-index:4;max-height:46%;display:flex;flex-direction:column;gap:8px}
.etHead{display:flex;align-items:center;gap:8px}
.etHead b{font-family:'Fredoka','Nunito',sans-serif;font-size:17px}
.etHead .mut{flex:1;font-size:12px}
.mut{color:var(--mut)}
#etSel{display:flex;align-items:center;gap:6px;background:#fff6dc;border-radius:14px;padding:6px 8px;font-weight:800;font-size:13px}
#etSel span{flex:1}
.etList{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.etItem{flex:none;width:74px;border:2px solid var(--line);background:#fffaf5;border-radius:16px;padding:4px;text-align:center;font-size:11px;font-weight:800;position:relative}
.etItem img{width:60px;height:60px;display:block;margin:0 auto}
.etItem.on{border-color:var(--pink);background:#fff0f5}
.etItem.off{opacity:.4}
.etItem .cnt{position:absolute;top:3px;right:5px;background:var(--ink);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.swrow{display:flex;gap:6px;align-items:center;overflow-x:auto;font-size:12px;font-weight:800}
.sw{flex:none;width:30px;height:30px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.screen{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:14px 14px 40px;display:none;z-index:5;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.screen h2{font-size:24px;margin-bottom:4px}
.sub{color:var(--mut);font-weight:700;font-size:13px;margin:0 0 12px}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.opt{position:relative;border:2px solid var(--line);background:#fff;border-radius:18px;padding:4px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opt canvas{width:100%;height:100%}
.opt.on{border-color:var(--pink);box-shadow:0 0 0 3px #ffd3e2}
.opt .lock{position:absolute;inset:auto 4px 4px auto;background:var(--ink);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 6px}
.opt.locked canvas{opacity:.55}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.colors button.on{box-shadow:0 0 0 3px var(--pink)}
.studioTop{display:flex;gap:12px;align-items:center;margin-bottom:12px}
#studioCv{width:150px;height:175px;flex:none;background:radial-gradient(circle at 50% 70%,#ffe3ec,#fff5f8 70%);border-radius:24px}
.studioSide{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.studioSide input{border:2px solid var(--line);border-radius:14px;padding:9px 12px;font:inherit;font-weight:800;font-size:15px;width:100%;outline:none}
.studioSide input:focus{border-color:var(--pink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.label{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 6px}
.shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shopItem{background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.shopItem img{width:84px;height:84px}
.shopItem .nm{font-weight:800;font-size:14px}
.shopItem .own{font-size:11px;color:var(--mut);font-weight:800}
.gameCard{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gameCard .ic{font-size:40px;width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none}
.gameCard .info{flex:1;min-width:0}
.gameCard h3{font-size:18px}
.gameCard p{margin:2px 0;font-size:13px;color:var(--mut);font-weight:700}
.gift{background:linear-gradient(135deg,#ffe3ec,#fff6dc);border-color:#ffd3e2}
#modal{position:fixed;inset:0;background:rgba(59,47,63,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#modalCard{position:relative;background:#fff;border-radius:26px;padding:20px 18px 18px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(59,47,63,.3);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#modalCard .x{position:absolute;top:10px;right:10px;border:0;background:#f4eefc;width:32px;height:32px;border-radius:50%;font-size:14px}
.center{text-align:center}
.center .row{justify-content:center}
.big{font-size:48px}
.listRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.listRow:last-child{border-bottom:0}
.listRow canvas{width:40px;height:40px;border-radius:50%;background:#fff0f5;flex:none}
.listRow .t{flex:1;min-width:0}
.listRow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listRow .t small{color:var(--mut);font-weight:700}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#gameOv{position:fixed;inset:0;z-index:40;background:#1e1b3a;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.ghud{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;font-weight:800}
.ghud #gTitle{font-family:'Fredoka','Nunito',sans-serif;font-size:18px;flex:1}
.ghud .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.ghud .iconbtn{background:rgba(255,255,255,.15);color:#fff}
#gCanvas{display:block;touch-action:none;flex:1}
#memGrid{position:absolute;left:0;right:0;top:calc(56px + env(safe-area-inset-top));bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;max-width:460px;margin:0 auto;align-content:center}
.mcard{aspect-ratio:3/4;border:0;border-radius:16px;background:linear-gradient(135deg,#ff8fb1,#a78bfa);box-shadow:0 4px 0 rgba(0,0,0,.25);font-size:34px;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
.mcard .f{opacity:0;transition:opacity .15s}
.mcard.up{background:#fff;transform:rotateY(0)}
.mcard.up .f{opacity:1}
.mcard.done{background:#d9fbe9;box-shadow:0 4px 0 #9fe3c1}
.mcard::after{content:'★';color:rgba(255,255,255,.6);font-size:26px;position:absolute}
.mcard{position:relative}
.mcard.up::after,.mcard.done::after{content:''}
#coinFly{position:fixed;z-index:61;font-weight:800;color:#c98a00;font-size:18px;pointer-events:none;opacity:0}
#coinFly.go{animation:fly 1.1s ease-out}
@keyframes fly{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@media (min-width:700px){.screen{padding:20px max(20px,calc(50% - 360px)) 40px}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button id="meBtn" aria-label="Your avatar"><canvas id="meHead" width="72" height="72"></canvas><span id="meNick">You</span></button>
    <div id="loc"><span id="locName">Pocket Plaza</span><span id="online" class="solo">connecting…</span></div>
    <span class="pill" id="coinPill">🪙 <b id="coins">0</b></span>
    <button id="muteBtn" class="iconbtn" aria-label="Sound">🔊</button>
  </header>
  <main id="stage">
    <canvas id="world"></canvas>
    <div id="worldUI">
      <div class="topbar" id="roomBar"></div>
      <div id="chatLog" class="hidden"></div>
      <div id="emoteTray" class="hidden"></div>
      <form id="chatBar" autocomplete="off">
        <button type="button" class="iconbtn" id="emoteBtn" aria-label="Emotes">😊</button>
        <button type="button" class="iconbtn" id="logBtn" aria-label="Chat history">💬</button>
        <input id="chatIn" maxlength="80" placeholder="Say something…" enterkeyhint="send">
        <button class="btn" id="sendBtn">Send</button>
      </form>
      <div id="editTray" class="hidden"></div>
    </div>
    <section class="screen" id="scr-games"></section>
    <section class="screen" id="scr-shop"></section>
    <section class="screen" id="scr-style"></section>
  </main>
  <nav id="nav">
    <button data-tab="plaza" class="on"><span class="i">🌳</span>Plaza</button>
    <button data-tab="home"><span class="i">🏠</span>My Room</button>
    <button data-tab="games"><span class="i">🎮</span>Games</button>
    <button data-tab="shop"><span class="i">🛍️</span>Shop</button>
    <button data-tab="style"><span class="i">👗</span>Style</button>
  </nav>
</div>
<div id="modal" class="hidden"><div id="modalCard"></div></div>
<div id="toast"></div>
<div id="coinFly"></div>
<div id="gameOv" class="hidden">
  <div class="ghud"><button class="iconbtn" id="gQuit" aria-label="Quit">✕</button><span id="gTitle"></span><span class="pill" id="gInfo"></span><span class="pill">⭐ <b id="gScore">0</b></span></div>
  <canvas id="gCanvas"></canvas>
  <div id="memGrid" class="hidden"></div>
</div>
<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
const BAD_CH=/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g;
const cleanNick=s=>typeof s==='string'?s.replace(BAD_CH,'').trim().slice(0,16):'';
const cleanMsg=s=>typeof s==='string'?s.replace(BAD_CH,'').trim().slice(0,80):'';
const cleanUid=s=>(typeof s==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,150}$/.test(s)&&s!=='.'&&s!=='..')?s:'';
const intIn=(v,a,b,d)=>{v=Math.round(+v);return Number.isFinite(v)?clamp(v,a,b):d};
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
const SC=new Map();
function shade(hex,a){const k=hex+a;let v=SC.get(k);if(v)return v;const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
 if(a<0){r*=1+a;g*=1+a;b*=1+a}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}
 v=`rgb(${r|0},${g|0},${b|0})`;SC.set(k,v);return v}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ================= sound ================= */
let AC=null,muted=false;
try{muted=localStorage.getItem('pp.mute')==='1'}catch(e){}
function unlockAudio(){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f1,f2,dur,type,vol,delay){if(muted||!AC)return;try{const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.02)}catch(e){}}
function sfx(k){switch(k){
 case 'tap':tone(660,880,.06,'sine',.06);break;
 case 'coin':tone(988,988,.08,'square',.05);tone(1319,1319,.18,'square',.05,.08);break;
 case 'coin2':tone(1200,1600,.08,'triangle',.08);break;
 case 'pop':tone(500,1400,.07,'sine',.1);break;
 case 'bad':tone(220,110,.25,'square',.06);break;
 case 'place':tone(420,620,.09,'triangle',.1);break;
 case 'chat':tone(780,1040,.07,'sine',.06);break;
 case 'win':[523,659,784,1047].forEach((f,i)=>tone(f,f,.16,'triangle',.08,i*.1));break;
}}

/* ================= avatar catalog ================= */
const COLORS=['#ff8fb1','#ff6b6b','#ffb86b','#ffe17a','#8fe3a8','#5cc8c8','#7ab8ff','#a78bfa','#ffffff','#4a4458','#2f3d66','#c9a27c'];
const OPTS={
 skin:['#ffe3cf','#f9cfae','#eab48c','#cf9468','#9a6544','#6b432b'],
 hc:['#3b2a24','#6b4430','#c98a4b','#f2d27a','#e86a5c','#ff9cc2','#8ec5ff','#b49cff','#f4f1ea','#4fbf8f'],
 hair:['short','bob','long','pony','bun','twin','spiky','curly','buzz'],
 eyes:['dot','happy','sparkle','sleepy','wink','cat'],
 mouth:['smile','grin','cat','o','flat','tongue'],
 top:['tee','hoodie','sweater','overall','dress','sailor','suit'],
 tc:COLORS,bottom:['pants','shorts','skirt'],bc:COLORS,
 hat:['none','cap','beanie','flower','bow','bunny','catears','tophat','halo','crown'],
 acc:['none','glasses','sunnies','star','blush']
};
const LOOK_DEF={skin:'#ffe3cf',hair:'short',hc:'#6b4430',eyes:'dot',mouth:'smile',top:'tee',tc:'#7ab8ff',bottom:'pants',bc:'#4a4458',hat:'none',acc:'none'};
const PRICES={'hair:pony':40,'hair:bun':60,'hair:twin':120,'hair:spiky':80,'hair:curly':100,'eyes:sparkle':100,'eyes:cat':80,'eyes:wink':40,'mouth:cat':60,'mouth:tongue':50,
 'top:hoodie':80,'top:sweater':90,'top:overall':100,'top:dress':120,'top:sailor':150,'top:suit':200,'bottom:skirt':60,
 'hat:cap':60,'hat:beanie':70,'hat:flower':90,'hat:bow':90,'hat:bunny':180,'hat:catears':180,'hat:tophat':250,'hat:halo':400,'hat:crown':500,
 'acc:glasses':70,'acc:sunnies':120,'acc:star':80,'acc:blush':40};
const NAMES={short:'Short',bob:'Bob',long:'Long',pony:'Ponytail',bun:'Bun',twin:'Twin tails',spiky:'Spiky',curly:'Curly',buzz:'Buzz',
 dot:'Classic',happy:'Happy',sparkle:'Sparkle',sleepy:'Sleepy',wink:'Wink',cat:'Cat',smile:'Smile',grin:'Grin',o:'Oh!',flat:'Calm',tongue:'Silly',
 tee:'T-shirt',hoodie:'Hoodie',sweater:'Sweater',overall:'Overalls',dress:'Dress',sailor:'Sailor',suit:'Suit',pants:'Pants',shorts:'Shorts',skirt:'Skirt',
 none:'None',cap:'Cap',beanie:'Beanie',flower:'Flower',bow:'Bow',bunny:'Bunny ears',catears:'Cat ears',tophat:'Top hat',halo:'Halo',crown:'Crown',
 glasses:'Glasses',sunnies:'Shades',star:'Star clip',blush:'Rosy cheeks'};
function sanitizeLook(l){const o={};l=(l&&typeof l==='object')?l:{};for(const k in LOOK_DEF){const v=l[k];o[k]=(typeof v==='string'&&OPTS[k].includes(v))?v:LOOK_DEF[k]}return o}

/* ================= furniture & room styles ================= */
const OUT='rgba(59,47,63,.32)',INK='#3b2f3f';
const TW=72,TH=36,AVS=.82;
function P(dx,dy,dz){return[(dx-dy)*TW/2,(dx+dy)*TH/2-dz]}
function poly(c,pts,fill,stroke){c.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])}c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
function box(c,cx,cy,w,d,z,h,col){const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2,z1=z+h;
 poly(c,[P(x0,y1,z),P(x1,y1,z),P(x1,y1,z1),P(x0,y1,z1)],shade(col,-.1),OUT);
 poly(c,[P(x1,y0,z),P(x1,y1,z),P(x1,y1,z1),P(x1,y0,z1)],shade(col,-.24),OUT);
 poly(c,[P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],col,OUT)}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function star(c,x,y,R,r,col,rot){c.beginPath();for(let i=0;i<10;i++){const a=(rot||0)-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath();c.fillStyle=col;c.fill();c.strokeStyle=INK;c.lineWidth=1.4;c.stroke()}
function blobs(c,list){c.lineWidth=1.3;c.strokeStyle=OUT;for(const [x,y,r,col] of list){c.fillStyle=col;ell(c,x,y,r,r*.9);c.fill();c.stroke()}}

function drawAvatar(c,L,o){
 o=o||{};const t=o.t||0,mv=!!o.moving,w=o.walk||0,back=!!o.back;
 c.save();
 if(!o.noShadow){c.fillStyle='rgba(60,30,80,.16)';ell(c,0,0,15,5);c.fill()}
 const bob=mv?-Math.abs(Math.sin(w))*2.4:Math.sin(t*2.4)*.6;
 c.translate(0,bob);c.scale(o.fx||1,1);
 c.lineWidth=1.6;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';
 const sk=L.skin;
 for(const s of [-1,1]){const lift=mv?Math.max(0,Math.sin(w)*s)*4:0,lx=s*5.5;c.save();c.translate(0,-lift);
  if(L.bottom==='pants'){c.fillStyle=L.bc;rr(c,lx-4,-23,8,21,3.5);c.fill();c.stroke()}
  else{c.fillStyle=sk;rr(c,lx-3.5,-20,7,18,3.5);c.fill();c.stroke();if(L.bottom==='shorts'){c.fillStyle=L.bc;rr(c,lx-4.6,-24,9.2,11,3);c.fill();c.stroke()}}
  c.fillStyle='#5a4660';ell(c,lx+1.2,-2.2,5.6,3.2);c.fill();c.stroke();c.restore()}
 if(L.bottom==='skirt'&&L.top!=='dress'){c.fillStyle=L.bc;c.beginPath();c.moveTo(-12,-27);c.lineTo(12,-27);c.lineTo(16,-13);c.quadraticCurveTo(0,-10,-16,-13);c.closePath();c.fill();c.stroke()}
 if(L.top==='hoodie'){c.fillStyle=shade(L.tc,-.12);ell(c,0,-46,15,6);c.fill();c.stroke()}
 const white=(L.top==='overall'||L.top==='sailor');
 const sleeve=L.top==='dress'?sk:white?'#ffffff':L.tc;
 const arm=s=>{let a=mv?Math.sin(w)*s*.55:Math.sin(t*2.4+s)*.05;
  if(o.cheer)a=-2.6*s;else if(o.wave&&s===1)a=-2.5+Math.sin(t*16)*.35;
  c.save();c.translate(s*11.5,-42);c.rotate(a);c.fillStyle=sleeve;rr(c,-3.6,-2,7.2,15,3.6);c.fill();c.stroke();c.fillStyle=sk;ell(c,0,14.5,3.8,3.8);c.fill();c.stroke();c.restore()};
 if(back){arm(-1);arm(1)}
 if(L.top==='dress'){c.fillStyle=L.tc;c.beginPath();c.moveTo(-10.5,-46);c.lineTo(10.5,-46);c.lineTo(17,-12);c.quadraticCurveTo(0,-8,-17,-12);c.closePath();c.fill();c.stroke();
  if(!back){c.fillStyle='#fff';c.beginPath();c.moveTo(-6,-46);c.lineTo(6,-46);c.lineTo(0,-40);c.closePath();c.fill();c.stroke();c.fillStyle=shade(L.tc,-.15);c.fillRect(-12,-33,24,3)}}
 else{c.fillStyle=white?'#ffffff':L.tc;rr(c,-12,-46,24,25,8);c.fill();c.stroke();if(!back)topDetail(c,L)}
 if(!back){arm(-1);arm(1)}
 c.fillStyle=sk;rr(c,-4,-50,8,7,2);c.fill();
 if(!back)hairBack(c,L);
 c.fillStyle=sk;ell(c,-20,-63,3.6,4.6);c.fill();c.stroke();ell(c,20,-63,3.6,4.6);c.fill();c.stroke();
 ell(c,0,-66,21,20);c.fill();c.stroke();
 if(back){c.fillStyle=L.hc;ell(c,0,-67.5,22.5,21);c.fill();c.stroke();hairBack(c,L);if(L.acc==='star')star(c,-15,-80,6,2.6,'#ffd84a')}
 else{face(c,L,t,o);hairFront(c,L);acc(c,L)}
 hat(c,L,back);
 c.restore();
}

 else if(s==='twin'){ell(c,-26,-54,7,14);c.fill();c.stroke();ell(c,26,-54,7,14);c.fill();c.stroke()}

 switch(s){

  case 'bob':case 'long':{const yb=s==='long'?-46:-50;c.lineTo(23,yb);c.lineTo(16.5,yb);c.lineTo(16,-71);c.quadraticCurveTo(0,-75,-16,-71);c.lineTo(-16.5,yb);c.lineTo(-23,yb);break}

 if(edit.tray){const k=edit.tray,isRug=!!F[k].rug;if(prof.room.some(it=>it.x===i&&it.y===j&&!!F[it.k].rug===isRug)){toast('That spot is taken');return}
  if(avail(k)>0){prof.room.push({k,x:i,y:j,f:0});sfx('place');if(avail(k)<=0)edit.tray=null;edit.sel=prof.room.length-1;roomChanged()}return}

function thumbFurn(k){thumbFurn.c=thumbFurn.c||{};if(thumbFurn.c[k])return thumbFurn.c[k];const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');x.scale(2,2);x.translate(48,72);x.scale(.85,.85);poly(x,[P(-.5,-.5,0),P(.5,-.5,0),P(.5,.5,0),P(-.5,.5,0)],'#f6ece2');F[k].d(x,1);return thumbFurn.c[k]=c.toDataURL()}
function thumbStyle(kind,id){const k=kind+id;thumbFurn.c=thumbFurn.c||{};if(thumbFurn.c[k])return thumbFurn.c[k];const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');x.scale(2,2);x.translate(48,58);x.scale(.62,.62);
 const wl=kind==='w'?wallById(id):WALLS[0],fl=kind==='f'?floorById(id):FLOORS[0];for(let i=0;i<2;i++)for(let j=0;j<2;j++)poly(x,[P(i-.5,j-.5,0),P(i+.5,j-.5,0),P(i+.5,j+.5,0),P(i-.5,j+.5,0)],(i+j)%2?fl.a:fl.b);
 for(let s=0;s<4;s++){const a=-.5+s*.5;poly(x,[P(-.5,a,0),P(-.5,a+.5,0),P(-.5,a+.5,70),P(-.5,a,70)],s%2?wl.a:wl.b);poly(x,[P(a,-.5,0),P(a+.5,-.5,0),P(a+.5,-.5,70),P(a,-.5,70)],shade(s%2?wl.a:wl.b,-.07))}
 return thumbFurn.c[k]=c.toDataURL()}

 const g=s.querySelector('#shGrid');
 const card=(img,name,price,ownTxt,btnTxt,btnCls,fn)=>{const d=document.createElement('div');d.className='shopItem';d.innerHTML='<img alt=""><div class="nm"></div><div class="own"></div><button></button>';d.querySelector('img').src=img;d.querySelector('.nm').textContent=name;d.querySelector('.own').textContent=ownTxt;const b=d.querySelector('button');b.className='btn small '+(btnCls||'');b.textContent=btnTxt;b.onclick=()=>{sfx('tap');fn()};g.appendChild(d)};
 if(shopTab==='furn'){for(const k in F){const n=prof.inv[k]||0;card(thumbFurn(k),F[k].n,F[k].p,n?`You own ${n}`:'',`${F[k].p} 🪙`,'',()=>{if(prof.coins<F[k].p){toast('Not enough coins — play games to earn more! 🎮');return}addCoins(-F[k].p);prof.inv[k]=(prof.inv[k]||0)+1;saveProfile();toast(F[k].n+' added to your room inventory!');renderShop()})}}
 else{const isW=shopTab==='wall',arr=isW?WALLS:FLOORS,own=isW?prof.walls:prof.floors,cur=isW?prof.wall:prof.floor;
  for(const w of arr){const o=own.includes(w.id);card(thumbStyle(isW?'w':'f',w.id),w.n,w.p,o?(cur===w.id?'In use':'Owned'):'',o?(cur===w.id?'✓ Using':'Use'):`${w.p} 🪙`,o?'mint':'',()=>{
   if(!o){if(prof.coins<w.p){toast('Not enough coins — play games to earn more! 🎮');return}addCoins(-w.p);own.push(w.id)}
   if(isW)prof.wall=w.id;else prof.floor=w.id;if(scene.mine){scene.wall=prof.wall;scene.floor=prof.floor}saveProfile();publishRoom();toast('Room updated!');renderShop()})}}}

/* ================= games screen ================= */
function renderGames(){const s=$('#scr-games');const gift=prof.gift!==today();
 s.innerHTML=`<h2>Game Corner</h2><p class="sub">Play mini-games to earn coins for clothes and furniture.</p>
 <div class="card gift gameCard"><div class="ic" style="background:#fff">🎁</div><div class="info"><h3>Daily gift</h3><p>${gift?'Your free coins are ready!':'Come back tomorrow for more.'}</p></div><button class="btn" id="giftBtn" ${gift?'':'disabled'}>${gift?'+100 🪙':'Claimed'}</button></div><div id="gList"></div>`;
 s.querySelector('#giftBtn').onclick=()=>{if(prof.gift===today())return;prof.gift=today();addCoins(100);sfx('win');renderGames()};
 const list=s.querySelector('#gList');for(const g of GAMES){const best=prof.best[g.id];const d=document.createElement('div');d.className='card gameCard';d.innerHTML=`<div class="ic" style="background:${g.bg}">${g.icon}</div><div class="info"><h3>${g.name}</h3><p>${g.desc}</p><p>🏆 Best: ${best==null?'—':best+(g.lower?' moves':' pts')}</p></div><button class="btn mint">Play</button>`;d.querySelector('button').onclick=()=>{sfx('tap');openGame(g.id)};list.appendChild(d)}}

/* ================= mini-games ================= */
const gc=$('#gCanvas'),gx=gc.getContext('2d');let GW=300,GH=300;const GO={active:null};
function sizeGame(){const r=gc.getBoundingClientRect();GW=Math.max(1,r.width);GH=Math.max(1,r.height);gc.width=Math.round(GW*dpr);gc.height=Math.round(GH*dpr)}
new ResizeObserver(()=>{if(GO.active)sizeGame()}).observe(gc);
function openGame(id){unlockAudio();$('#gameOv').classList.remove('hidden');$('#memGrid').classList.add('hidden');sizeGame();const def=GAMES.find(g=>g.id===id);$('#gTitle').textContent=def.icon+' '+def.name;setWhere('games');
 GO.active=id==='star'?startStar():id==='bubble'?startBubble():startMemory();$('#gScore').textContent='0'}
function closeGame(){GO.active=null;$('#gameOv').classList.add('hidden');$('#memGrid').classList.add('hidden')}
$('#gQuit').onclick=()=>{closeGame();go('games')};
const gPtr=e=>{if(!GO.active)return;const r=gc.getBoundingClientRect();GO.active.ptr&&GO.active.ptr(e.clientX-r.left,e.clientY-r.top,e.type)};
gc.addEventListener('pointerdown',e=>{unlockAudio();try{gc.setPointerCapture(e.pointerId)}catch(_){}gPtr(e)});gc.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType!=='mouse')gPtr(e);else if(GO.active&&GO.active.id==='star')gPtr(e)});
function finishGame(id,score,coins){const def=GAMES.find(g=>g.id===id),b=prof.best[id];const better=b==null||(def.lower?score<b:score>b);if(better)prof.best[id]=score;
 GO.active.done=true;addCoins(coins);sfx('win');
 setTimeout(()=>modal(`<div class="center"><div class="big">${def.icon}</div><h3>${def.name}</h3><p style="font-weight:800;margin:8px 0">${def.lower?'Moves':'Score'}: ${score}${better?' · 🏆 New best!':''}</p><p style="font-size:22px;font-weight:800;color:#c98a00;margin:6px 0 14px">+${coins} 🪙</p><div class="row"><button class="btn" id="gAgain">Play again</button><button class="btn ghost" id="gDone">Done</button></div></div>`,c=>{
  c.querySelector('#gAgain').onclick=()=>{closeModal();openGame(id)};c.querySelector('#gDone').onclick=()=>{closeModal();closeGame();go('games')};c.querySelector('.x').onclick=()=>{closeModal();closeGame();go('games')}}),400)}
function floaters(g,dt){for(const f of g.fl){f.y-=40*dt;f.a-=dt*1.2}g.fl=g.fl.filter(f=>f.a>0);for(const f of g.fl){gx.globalAlpha=Math.max(0,f.a);gx.fillStyle=f.c;gx.font='800 20px Nunito,sans-serif';gx.textAlign='center';gx.fillText(f.t,f.x,f.y)}gx.globalAlpha=1}
const bgStars=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),r:rnd(.5,1.8),p:rnd(0,6)}));
function startStar(){const g={id:'star',score:0,lives:3,time:45,el:0,items:[],sp:.5,px:GW/2,tx:GW/2,fx:1,walk:0,moving:false,cheer:0,fl:[],keys:{},hurt:0};
 g.ptr=x=>{g.tx=clamp(x,24,GW-24)};g.key=(k,d)=>{g.keys[k]=d};
 g.update=dt=>{if(g.done)return;g.time-=dt;g.el+=dt;g.sp-=dt;
  if(g.keys.ArrowLeft||g.keys.a)g.tx=clamp(g.tx-420*dt,24,GW-24);if(g.keys.ArrowRight||g.keys.d)g.tx=clamp(g.tx+420*dt,24,GW-24);
  if(g.sp<=0){g.sp=Math.max(.24,.72-g.el*.012);const r=Math.random();g.items.push({x:rnd(24,GW-24),y:-24,vy:rnd(140,200)+g.el*5,type:r<.07?'big':r<.11?'heart':r<.37?'cloud':'star',rot:rnd(0,6)})}
  const old=g.px;g.px+=(g.tx-g.px)*Math.min(1,dt*12);const v=(g.px-old)/dt;g.moving=Math.abs(v)>25;if(g.moving){g.fx=v>0?1:-1;g.walk+=dt*12}
  const py=GH-22;for(const it of g.items){it.y+=it.vy*dt;it.rot+=dt*2;if(!it.hit&&it.y>py-95&&it.y<py-10&&Math.abs(it.x-g.px)<32){it.hit=true;
   if(it.type==='star'){g.score+=1;sfx('coin2');g.fl.push({x:it.x,y:it.y,t:'+1',a:1,c:'#ffe17a'})}else if(it.type==='big'){g.score+=5;g.cheer=T+.8;sfx('win');g.fl.push({x:it.x,y:it.y,t:'+5',a:1,c:'#ff9cc2'})}
   else if(it.type==='heart'){g.lives=Math.min(3,g.lives+1);sfx('pop');g.fl.push({x:it.x,y:it.y,t:'♥',a:1,c:'#ff6b9b'})}else{g.lives--;g.hurt=T+.4;sfx('bad');g.fl.push({x:it.x,y:it.y,t:'−♥',a:1,c:'#aab'})}}}
  g.items=g.items.filter(it=>!it.hit&&it.y<GH+40);$('#gScore').textContent=g.score;$('#gInfo').textContent='⏱ '+Math.max(0,Math.ceil(g.time))+'  '+'♥'.repeat(Math.max(0,g.lives));
  if(g.time<=0||g.lives<=0)finishGame('star',g.score,g.score)};
 g.draw=dt=>{const c=gx;c.setTransform(dpr,0,0,dpr,0,0);const bg=c.createLinearGradient(0,0,0,GH);bg.addColorStop(0,'#1e1b3a');bg.addColorStop(1,'#5b4a9a');c.fillStyle=bg;c.fillRect(0,0,GW,GH);
  for(const s of bgStars){c.globalAlpha=.4+Math.sin(T*2+s.p)*.3;c.fillStyle='#fff';ell(c,s.x*GW,s.y*GH*.8,s.r,s.r);c.fill()}c.globalAlpha=1;
  c.fillStyle='#3d6b4f';c.fillRect(0,GH-14,GW,14);c.fillStyle='#4f8a62';c.fillRect(0,GH-14,GW,4);
  for(const it of g.items){if(it.type==='star')star(c,it.x,it.y,13,6,'#ffe17a',it.rot*.3);else if(it.type==='big'){c.shadowColor='#ff9cc2';c.shadowBlur=14;star(c,it.x,it.y,19,9,'#ff9cc2',it.rot*.3);c.shadowBlur=0}
   else if(it.type==='heart'){c.fillStyle='#ff6b9b';const x=it.x,y=it.y;c.beginPath();c.moveTo(x,y+9);c.bezierCurveTo(x-15,y-2,x-7,y-14,x,y-6);c.bezierCurveTo(x+7,y-14,x+15,y-2,x,y+9);c.fill()}
   else{c.fillStyle='#8a8fb0';ell(c,it.x,it.y,18,11);c.fill();ell(c,it.x-10,it.y+3,10,8);c.fill();ell(c,it.x+11,it.y+3,10,8);c.fill();c.fillStyle='#ffe17a';c.beginPath();c.moveTo(it.x-2,it.y+10);c.lineTo(it.x+5,it.y+10);c.lineTo(it.x,it.y+20);c.lineTo(it.x+3,it.y+13);c.lineTo(it.x-4,it.y+13);c.closePath();c.fill()}}
  c.save();c.translate(g.px,GH-14);if(T<g.hurt&&Math.floor(T*20)%2)c.globalAlpha=.4;drawAvatar(c,prof.look,{t:T,moving:g.moving,walk:g.walk,fx:g.fx,cheer:T<g.cheer||!g.moving});c.restore();c.globalAlpha=1;
  floaters(g,dt);if(g.el<2.5){c.fillStyle='rgba(255,255,255,'+(1-g.el/2.5)+')';c.font='800 16px Nunito,sans-serif';c.textAlign='center';c.fillText('Drag or use ← → to move',GW/2,GH*.4)}};
 return g}
function startBubble(){const g={id:'bubble',score:0,time:30,el:0,b:[],sp:.2,fl:[],parts:[]};
 g.ptr=(x,y,type)=>{if(type!=='pointerdown'||g.done)return;for(let i=g.b.length-1;i>=0;i--){const b=g.b[i];if(Math.hypot(x-b.x,y-b.y)<b.r+8){g.b.splice(i,1);const v=b.type==='gold'?5:b.type==='spiky'?-3:1;g.score=Math.max(0,g.score+v);sfx(v>0?'pop':'bad');
   for(let k=0;k<10;k++){const a=k/10*Math.PI*2;g.parts.push({x:b.x,y:b.y,vx:Math.cos(a)*rnd(60,140),vy:Math.sin(a)*rnd(60,140),a:1,c:b.type==='gold'?'#ffd84a':b.type==='spiky'?'#a78bfa':'#9fdcff'})}
   g.fl.push({x:b.x,y:b.y,t:(v>0?'+':'')+v,a:1,c:v>0?(v>1?'#ffb400':'#2b8fd6'):'#a050d0'});return}}};
 g.update=dt=>{if(g.done)return;g.time-=dt;g.el+=dt;g.sp-=dt;if(g.sp<=0){g.sp=Math.max(.2,.5-g.el*.01);const r=Math.random();g.b.push({x:rnd(30,GW-30),y:GH+30,r:rnd(20,34),vy:rnd(70,120)+g.el*3,type:r<.1?'gold':r<.24?'spiky':'n',hue:rnd(180,330),wob:rnd(0,6)})}
  for(const b of g.b){b.y-=b.vy*dt;b.x+=Math.sin(T*2+b.wob)*24*dt}g.b=g.b.filter(b=>b.y>-50);for(const p of g.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*2}g.parts=g.parts.filter(p=>p.a>0);
  $('#gScore').textContent=g.score;$('#gInfo').textContent='⏱ '+Math.max(0,Math.ceil(g.time));if(g.time<=0)finishGame('bubble',g.score,g.score)};
 g.draw=dt=>{const c=gx;c.setTransform(dpr,0,0,dpr,0,0);const bg=c.createLinearGradient(0,0,0,GH);bg.addColorStop(0,'#c9f0ff');bg.addColorStop(1,'#7cc6f0');c.fillStyle=bg;c.fillRect(0,0,GW,GH);
  c.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<5;i++){ell(c,(i*0.23+.1)*GW,GH-20+Math.sin(T+i)*4,60,18);c.fill()}
  for(const b of g.b){c.save();c.translate(b.x,b.y);if(b.type==='spiky'){c.fillStyle='#a78bfa';c.beginPath();for(let i=0;i<16;i++){const a=i/16*Math.PI*2+T,r=i%2?b.r*.8:b.r*1.1;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();c.fillStyle=INK;ell(c,-5,-2,2,3);c.fill();ell(c,5,-2,2,3);c.fill()}
   else{const gr=c.createRadialGradient(-b.r*.3,-b.r*.3,2,0,0,b.r);if(b.type==='gold'){gr.addColorStop(0,'#fff8d0');gr.addColorStop(1,'#ffc94a')}else{gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.7,`hsla(${b.hue},90%,85%,.5)`);gr.addColorStop(1,`hsla(${b.hue},90%,70%,.8)`)}
    c.fillStyle=gr;ell(c,0,0,b.r,b.r);c.fill();c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=2;c.stroke();c.fillStyle='rgba(255,255,255,.9)';ell(c,-b.r*.35,-b.r*.4,b.r*.18,b.r*.12);c.fill();if(b.type==='gold'){c.fillStyle='#b07a00';c.font='800 14px Nunito,sans-serif';c.textAlign='center';c.fillText('+5',0,5)}}c.restore()}
  for(const p of g.parts){c.globalAlpha=p.a;c.fillStyle=p.c;ell(c,p.x,p.y,3,3);c.fill()}c.globalAlpha=1;floaters(g,dt);
  if(g.el<2.5){c.fillStyle='rgba(59,47,63,'+(1-g.el/2.5)+')';c.font='800 16px Nunito,sans-serif';c.textAlign='center';c.fillText('Tap the bubbles!',GW/2,GH*.4)}};
 return g}
function startMemory(){const icons=['🍓','🐱','🌸','⭐','🍩','🎈','🐰','🍀'],deck=[...icons,...icons];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 const g={id:'memory',moves:0,time:0,open:[],lock:false,matched:0};const grid=$('#memGrid');grid.innerHTML='';grid.classList.remove('hidden');
 deck.forEach((ic,i)=>{const b=document.createElement('button');b.className='mcard';b.innerHTML='<span class="f"></span>';b.querySelector('.f').textContent=ic;b.onclick=()=>{
  if(g.done||g.lock||b.classList.contains('up')||b.classList.contains('done'))return;unlockAudio();sfx('tap');b.classList.add('up');g.open.push({b,ic});
  if(g.open.length===2){g.moves++;$('#gScore').textContent=g.moves;const [a,c]=g.open;if(a.ic===c.ic){setTimeout(()=>{a.b.classList.add('done');c.b.classList.add('done');a.b.classList.remove('up');c.b.classList.remove('up');sfx('coin2')},250);g.open=[];g.matched++;
    if(g.matched===8){const coins=clamp(90-(g.moves-8)*5,20,90);setTimeout(()=>finishGame('memory',g.moves,coins),600)}}
   else{g.lock=true;setTimeout(()=>{a.b.classList.remove('up');c.b.classList.remove('up');g.open=[];g.lock=false},750)}}};grid.appendChild(b)});
 g.update=dt=>{if(!g.done)g.time+=dt;$('#gInfo').textContent='⏱ '+Math.floor(g.time)+'s'};
 g.draw=()=>{const c=gx;c.setTransform(dpr,0,0,dpr,0,0);const bg=c.createLinearGradient(0,0,0,GH);bg.addColorStop(0,'#ffe3ec');bg.addColorStop(1,'#e8ddff');c.fillStyle=bg;c.fillRect(0,0,GW,GH)};
 $('#gScore').textContent='0';return g}

/* ================= main loop ================= */
let last=performance.now();
function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;T+=dt;
 for(const a of avatars.values())stepAv(a,dt);tickNpcs();
 if(GO.active){GO.active.update(dt);GO.active.draw(dt)}
 else if(curTab==='plaza'||curTab==='home'){updateCam(dt);render()}
 else if(curTab==='style'){const sc=$('#studioCv');if(sc){const c=sc.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,sc.width,sc.height);c.translate(sc.width/2,sc.height-18);c.scale(2.35,2.35);drawAvatar(c,prof.look,{t:T,back:studioBack,wave:T<studioWave})}}
 requestAnimationFrame(loop)}

/* ================= boot ================= */
function welcome(){if(prof.onboarded)return;modal(`<div class="center"><canvas id="wAv" width="300" height="340" style="width:150px;height:170px"></canvas><h3>Welcome to Pocket Plaza!</h3><p class="mut" style="font-weight:700;margin:6px 0 12px">Dress up, decorate your room, play games and hang out with friends.</p>
 <input id="wNick" maxlength="16" style="width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-weight:800;font-size:16px;text-align:center;margin-bottom:12px" aria-label="Nickname"><div class="row"><button class="btn" id="wStyle">👗 Dress up</button><button class="btn mint" id="wGo">🌳 Explore</button></div></div>`,c=>{
  const ni=c.querySelector('#wNick');ni.value=prof.nick;avatarCanvas(c.querySelector('#wAv'),prof.look,{wave:true});
  const done=tab=>{const v=cleanNick(ni.value);if(v){prof.nick=v;prof.nickSet=true}prof.onboarded=true;me.nick=prof.nick;lookChanged();closeModal();go(tab);if(tab==='plaza')toast('Tap the ground to walk around 👣')};
  c.querySelector('#wStyle').onclick=()=>done('style');c.querySelector('#wGo').onclick=()=>done('plaza');c.querySelector('.x').onclick=()=>done('plaza')})}
resize();enterPlaza();refreshHud();requestAnimationFrame(loop);
pushLog('','Welcome to Pocket Plaza! Tap a friend to wave or visit their room.',true);
let welcomed=false;const doWelcome=()=>{if(welcomed)return;welcomed=true;welcome()};
initCaps().catch(e=>{console.warn(e);MP.ready=true;updateOnline()}).finally(doWelcome);setTimeout(doWelcome,4000);
document.addEventListener('visibilitychange',()=>{last=performance.now()});
</script>
